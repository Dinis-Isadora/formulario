<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Formulário de Contato</title>
  <link rel="stylesheet" href="contato.css" />
</head>
<body>
  <main class="page">
    <section class="card">
      <h1>Formulário de Contato</h1>
      <p class="subtitle">Preencha os campos abaixo para enviar sua mensagem.</p>

      <form class="contact-form" action="#" method="POST">
        <div class="field">
          <label for="nome">Nome</label>
          <input type="text" id="nome" name="nome" placeholder="Seu nome completo" required />
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required />
        </div>

        <div class="field">
          <label for="assunto">Assunto</label>
          <select id="assunto" name="assunto" required>
            <option value="" selected disabled>Selecione um assunto</option>
            <option value="duvida">Dúvida</option>
            <option value="orcamento">Orçamento</option>
            <option value="suporte">Suporte</option>
            <option value="outro">Outro</option>
          </select>
        </div>

        <div class="field">
          <label for="mensagem">Mensagem</label>
          <textarea id="mensagem" name="mensagem" rows="6" placeholder="Digite sua mensagem..." required></textarea>
        </div>

        <button type="submit">Enviar mensagem</button>
      </form>
    </section>
  </main>
</body>
</html>
